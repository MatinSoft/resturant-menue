      /* hide scrollbar only on small screens */

      body {

          color 0.3s ease;
      }
      .fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      .fade-in-up {

      }

        from {

        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeInUp {

    <script type="text/babel">
      const getCSRFToken = () =>
        document.querySelector('meta[name="csrf-token"]').getAttribute("content");

      async function postJSON(url, payload) {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken(),
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || "Request failed");
        }
        return await res.json();
      }
      async function postForm(url, formData) {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "X-CSRFToken": getCSRFToken(),
          },
          body: formData,
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || "Request failed");
        }

        return await res.json();

                      isDark
                        ? "bg-dark-bg border-gold-700/30 text-white focus:border-gold-500 focus:ring-gold-500/20"
                        : "bg-white border-gold-200 text-charcoal focus:border-gold-500 focus:ring-gold-500/20"
                    } focus:outline-none focus:ring-2`}
                  >
                    {categories.map((cat) => (
                      <option key={cat} value={cat}>
                        {cat}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label
                  className={`block text-sm font-medium mb-2 ${isDark ? "text-gold-300" : "text-gray-700"}`}
                >
                  Ingredients
                </label>
                <div className="flex gap-2 mb-2">
                  <input
                    type="text"
                    value={ingredientInput}
                    onChange={(e) => setIngredientInput(e.target.value)}
                    onKeyPress={(e) => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        handleAddIngredient();
                      }
                    }}
                    placeholder="أضف مكون وثبته"
                    className={`flex-1 px-4 py-2 rounded-lg border transition-all duration-300 ${
                      isDark
                        ? "bg-dark-bg border-gold-700/30 text-white focus:border-gold-500 focus:ring-gold-500/20"
                        : "bg-white border-gold-200 text-charcoal focus:border-gold-500 focus:ring-gold-500/20"
                    } focus:outline-none focus:ring-2`}
                  />
                  <button
                    type="button"
                    onClick={handleAddIngredient}
                    className="px-4 py-2 bg-gold-600 hover:bg-gold-700 text-white rounded-lg font-medium transition-all duration-200"
                  >
                    Add
                  </button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {formData.ingredients.map((ing, idx) => (
                    <div
                      key={idx}
                      className={`px-3 py-1 rounded-full flex items-center gap-2 ${
                        isDark
                          ? "bg-dark-bg text-gold-300"
                          : "bg-cream text-charcoal"
                      }`}
                    >
                      {ing}
                      <button
                        type="button"
                        onClick={() => handleRemoveIngredient(idx)}
                        className="hover:text-red-500"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="submit"
                  className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-all duration-200"
                >
                  {food ? "Update" : "Add"}
                </button>
                <button
                  type="button"
                  onClick={onClose}
                  className={`flex-1 px-4 py-3 rounded-lg font-medium transition-all duration-200 ${
                    isDark
                      ? "bg-dark-bg hover:bg-dark-card text-gold-300 border border-gold-700/30"
                      : "bg-gold-100 hover:bg-gold-200 text-charcoal"
                  }`}
                >
                  Cancel
                </button>
              </div>
            </form>
          </Modal>
        );
      };

      // Category Form Modal
      const CategoryFormModal = ({
        isOpen,
        isDark,
        category,
        onSave,
        onClose,
      }) => {
        const [categoryName, setCategoryName] = useState(category || "");

        useEffect(() => {
          setCategoryName(category || "");
        }, [category]);

        const handleSubmit = (e) => {
          e.preventDefault();
          onSave(categoryName);
        };

        return (
          <Modal
            isOpen={isOpen}
            title={category ? "Edit Category" : "Add New Category"}
            isDark={isDark}
            onClose={onClose}
          >
            <form onSubmit={handleSubmit} className="p-6 md:p-8 space-y-4">
              <div>
                <label
                  className={`block text-sm font-medium mb-2 ${isDark ? "text-gold-300" : "text-gray-700"}`}
                >
                  اسم Category
                </label>
                <input
                  type="text"
                  value={categoryName}
                  onChange={(e) => setCategoryName(e.target.value)}
                  placeholder="Example: Appetizers"
                  className={`w-full px-4 py-2 rounded-lg border transition-all duration-300 ${
                    isDark
                      ? "bg-dark-bg border-gold-700/30 text-white focus:border-gold-500 focus:ring-gold-500/20"
                      : "bg-white border-gold-200 text-charcoal focus:border-gold-500 focus:ring-gold-500/20"
                  } focus:outline-none focus:ring-2`}
                  required
                />
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="submit"
                  className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-all duration-200"
                >
                  {category ? "Update" : "Add"}
                </button>
                <button
                  type="button"
                  onClick={onClose}
                  className={`flex-1 px-4 py-3 rounded-lg font-medium transition-all duration-200 ${
                    isDark
                      ? "bg-dark-bg hover:bg-dark-card text-gold-300 border border-gold-700/30"
                      : "bg-gold-100 hover:bg-gold-200 text-charcoal"
                  }`}
                >
                  Cancel
                </button>
              </div>
            </form>
          </Modal>
        );
      };

      const Footer = ({ config, isDark }) => (
        <footer
          className={`transition-colors duration-300 py-12 md:py-16 ${
            isDark
              ? "bg-dark-surface text-gray-300 border-t border-gold-700/30"
              : "bg-charcoal text-white"
          } hidden md:block`}
        >
          <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-12">
              <div>
                <div className="flex items-center gap-3 mb-4">
                  <Logo />
                  <span className="font-serif text-xl font-semibold">
                    {config.restaurant_name}
                  </span>
                </div>
                <p
                  className={`text-sm leading-relaxed ${isDark ? "text-gray-400" : "text-gray-400"}`}
                >
                Where tradition meets innovation. Every dish tells a story of passion,
                precision, and the finest ingredients.
                </p>
              </div>

              <div>
                <h4
                  className={`font-serif text-lg font-semibold mb-4 ${isDark ? "text-gold-400" : "text-gold-400"}`}
                >
                  Opening Hours
                </h4>
                <div
                  className={`space-y-2 text-sm ${isDark ? "text-gray-400" : "text-gray-400"}`}
                >
                  <p>Tuesday - Thursday: 5:00 PM - 10:00 PM</p>
                  <p>Friday - Saturday: 5:00 PM - 11:00 PM</p>
                  <p>Sunday: 4:00 PM - 9:00 PM</p>
                  <p>Monday: Closed</p>
                </div>
              </div>

              <div>
                <h4
                  className={`font-serif text-lg font-semibold mb-4 ${isDark ? "text-gold-400" : "text-gold-400"}`}
                >
                  Contact
                </h4>
                <div
                  className={`space-y-2 text-sm ${isDark ? "text-gray-400" : "text-gray-400"}`}
                >
                  <p>Fine Dining Street</p>
                  <p>Muscat, Oman 123456</p>
                  <p>reservations@lamaison.com</p>
                  <p>+968 2222 3333</p>
                </div>
              </div>
            </div>

            <div
              className={`mt-12 pt-8 border-t text-center ${isDark ? "border-gold-700/30 text-gray-500" : "border-gray-800 text-gray-500"}`}
            >
              <p className="text-sm">
                © 2024 {config.restaurant_name}. All rights reserved. | Crafted with passion.
              </p>
            </div>
          </div>
        </footer>
      );

      // Main App Component
      const App = () => {
        const [activeCategory, setActiveCategory] = useState(
          categories[0] || "المقبلات"
        );

        const [isDark, setIsDark] = useState(() => {
          if (typeof window !== "undefined") {
            const saved = localStorage.getItem("theme-dark");
            return saved ? JSON.parse(saved) : false;
          }
          return false;
        });

        // ✅ آیا کاربر ادمین است؟ فقط از Django می‌آید
        const isAdminUser = !!window.__IS_ADMIN_USER__;
        // ✅ حالت ویرایش (فقط برای ادمین قابل فعال/غیرفعال شدن است)
        const [isAdminMode, setIsAdminMode] = useState(false);

        // ✅ کنترل‌های ادمین فقط وقتی هر دو شرط برقرار باشد
        const canAdmin = isAdminUser && isAdminMode;

        const [menuData, setMenuData] = useState(initialMenuData);
        const [categoriesState, setCategoriesState] = useState(categories);

        // Modals state
        const [foodModalOpen, setFoodModalOpen] = useState(false);
        const [categoryModalOpen, setCategoryModalOpen] = useState(false);
        const [editingFood, setEditingFood] = useState(null);
        const [editingCategory, setEditingCategory] = useState(null);
        const [currentCategoryForFood, setCurrentCategoryForFood] =
          useState(null);

        const [config, setConfig] = useState({
          restaurant_name: "لا ميزون",
          tagline: "تناول فاخر",
        });

        const defaultConfig = {
          restaurant_name: "لا ميزون",
          tagline: "تناول فاخر",
        };

        // Apply theme
        useEffect(() => {
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          localStorage.setItem("theme-dark", JSON.stringify(isDark));
        }, [isDark]);

        // Initialize Element SDK
        useEffect(() => {
          if (window.elementSdk) {
            window.elementSdk.init({
              defaultConfig,
              onConfigChange: async (newConfig) => {
                setConfig((prev) => ({
                  ...prev,
                  restaurant_name:
                    newConfig.restaurant_name || defaultConfig.restaurant_name,
                  tagline: newConfig.tagline || defaultConfig.tagline,
                }));
              },
              mapToCapabilities: (cfg) => ({
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined,
              }),
              mapToEditPanelValues: (cfg) =>
                new Map([
                  [
                    "restaurant_name",
                    cfg.restaurant_name || defaultConfig.restaurant_name,
                  ],
                  ["tagline", cfg.tagline || defaultConfig.tagline],
                ]),
            });
          }
        }, []);

        // Category Management
        const handleAddCategory = async (categoryName) => {
          const name = (categoryName || "").trim();
          if (!name) return;

          const resp = await postJSON("/api/category/create/", { name });

          if (!categoriesState.includes(resp.name)) {
            setCategoriesState((prev) => [...prev, resp.name]);
          }

          setCategoryModalOpen(false);
          setEditingCategory(null);
        };
        const handleEditCategory = async (oldName, newName) => {
          const resp = await postJSON("/api/category/update/", {
            old_name: oldName,
            new_name: newName,
          });

          setCategoriesState((prev) =>
            prev.map((c) => (c === oldName ? resp.name : c)),
          );

          setMenuData((prev) =>
            prev.map((item) =>
              item.category === oldName ? { ...item, category: resp.name } : item,
            ),
          );

          setCategoryModalOpen(false);
          setEditingCategory(null);
        };
        const handleDeleteCategory = async (categoryName) => {
          if (!confirm(`هل متأكد من Delete Category "${categoryName}"؟`)) return;

          await postJSON("/api/category/delete/", { name: categoryName });

          setCategoriesState((prev) => prev.filter((c) => c !== categoryName));
          setMenuData((prev) => prev.filter((item) => item.category !== categoryName));
        };
        // Food Management
        const handleAddFood = (category) => {
          setCurrentCategoryForFood(category);
          setEditingFood(null);
          setFoodModalOpen(true);
        };

        const handleEditFood = (food) => {
          setEditingFood(food);
          setCurrentCategoryForFood(food.category);
          setFoodModalOpen(true);
        };

          const handleSaveFood = async (formData, imageFile) => {
            if (!formData.category) {
              alert("You must select a category first");
              return;
            }

            const fd = new FormData();
            fd.append("category", formData.category);
            fd.append("name", formData.name);
            fd.append("description", formData.description || "");
            fd.append("price", formData.price);
            fd.append("ingredients", JSON.stringify(formData.ingredients || []));

            if (imageFile) fd.append("image", imageFile);

            if (editingFood) {
              fd.append("id", editingFood.id);
              const resp = await postForm("/api/food/update/", fd);
              setMenuData((prev) =>
                prev.map((it) => (it.id === editingFood.id ? resp.food : it)),
              );
            } else {
              const resp = await postForm("/api/food/create/", fd);
              setMenuData((prev) => [...prev, resp.food]);
            }

            setFoodModalOpen(false);
            setEditingFood(null);
          };
        const handleDeleteFood = async (foodId) => {
          if (!confirm("هل متأكد من Delete هذا الطبق؟")) return;

          await postJSON("/api/food/delete/", { id: foodId });
          setMenuData((prev) => prev.filter((item) => item.id !== foodId));
        };
        const handleThemeToggle = () => {
          setIsDark((prev) => !prev);
        };

        // ✅ فقط ادمین می‌تواند وارد/خارج حالت ویرایش شود
        const handleAdminToggle = () => {
          if (!isAdminUser) return;
          setIsAdminMode((prev) => !prev);
        };

        const handleCategoryClick = (category) => {
          setActiveCategory(category);
          const element = document.getElementById(
            category.replace(" ", "-").toLowerCase(),
          );
          if (element) {
            element.scrollIntoView({ behavior: "smooth" });
          }
        };

        const handleSaveCategory = (categoryName) => {
          if (editingCategory) {
            handleEditCategory(editingCategory, categoryName);
          } else {
            handleAddCategory(categoryName);
          }
        };

        const groupedMenu = categoriesState.reduce((acc, category) => {
          acc[category] = menuData.filter((item) => item.category === category);
          return acc;
        }, {});

        return (
          <div
            className={`min-h-full transition-colors duration-300 ${
              isDark ? "bg-dark-bg text-white" : "bg-cream text-charcoal"
            }`}
          >
            <Header
              activeCategory={activeCategory}
              onCategoryClick={handleCategoryClick}
              config={config}
              isDark={isDark}
              onThemeToggle={handleThemeToggle}
              isAdmin={canAdmin}
              onAdminToggle={handleAdminToggle}
              isAdminUser={isAdminUser}
            />

            <HeroSection config={config} isDark={isDark} />

            <main
              className={`max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-2 md:py-10 lg:py-12`}
            >
              {canAdmin && (
                <div
                  className={`mb-12 p-6 rounded-2xl border-2 ${
                    isDark
                      ? "bg-red-900/20 border-red-700/50 text-red-200"
                      : "bg-red-50 border-red-300 text-red-700"
                  }`}
                >
                  <p className="font-medium flex items-center gap-2">
                    <svg
                      className="w-5 h-5"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fillRule="evenodd"
                        d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                        clipRule="evenodd"
                      />
                    </svg>
                    الوضع الإداري مفعل - يمكنك الآن Add وEdit وDelete الأصناف
                    والفئات
                  </p>
                </div>
              )}

              {categoriesState.map((category) => (
                <CategorySection
                  key={category}
                  category={category}
                  items={groupedMenu[category] || []}
                  isDark={isDark}
                  isAdmin={canAdmin}
                  onAddFood={handleAddFood}
                  onEditFood={handleEditFood}
                  onDeleteFood={handleDeleteFood}
                  onEditCategory={() => {
                    setEditingCategory(category);
                    setCategoryModalOpen(true);
                  }}
                  onDeleteCategory={handleDeleteCategory}
                />
              ))}
            </main>

            {/* Modals */}
            <FoodFormModal
              isOpen={foodModalOpen}
              isDark={isDark}
              food={editingFood}
              categories={categoriesState}
              defaultCategory={currentCategoryForFood}
              onSave={handleSaveFood}
              onClose={() => {
                setFoodModalOpen(false);
                setEditingFood(null);
              }}
            />
            <CategoryFormModal
              isOpen={categoryModalOpen}
              isDark={isDark}
              category={editingCategory}
              onSave={handleSaveCategory}
              onClose={() => {
                setCategoryModalOpen(false);
                setEditingCategory(null);
              }}
            />

            <Footer config={config} isDark={isDark} />
          </div>
        );
      };

      // Render
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
