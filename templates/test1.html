<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Maison - Fine Dining</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Lato:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Lato', 'system-ui', 'sans-serif'],
          },
          colors: {
            gold: {
              50: '#fdfcf7',
              100: '#f9f5e8',
              200: '#f1e6c5',
              300: '#e8d49d',
              400: '#dbb86d',
              500: '#c9a047',
              600: '#b8893a',
              700: '#996b31',
              800: '#7c562c',
              900: '#664728',
            },
            cream: '#faf8f3',
            charcoal: '#2d2d2d',
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>

    // Logo Component
    const Logo = () => (
      <svg viewBox="0 0 50 50" className="w-10 h-10 md:w-12 md:h-12">
        <circle cx="25" cy="25" r="23" fill="none" stroke="currentColor" strokeWidth="1.5" className="text-gold-600"/>
        <path d="M15 20 Q25 10 35 20" stroke="currentColor" strokeWidth="1.5" fill="none" className="text-gold-600"/>
        <path d="M15 30 Q25 40 35 30" stroke="currentColor" strokeWidth="1.5" fill="none" className="text-gold-600"/>
        <circle cx="25" cy="25" r="3" fill="currentColor" className="text-gold-600"/>
      </svg>
    );

    // Header Component
    const Header = ({ activeCategory, onCategoryClick, config }) => {
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className={`sticky top-0 z-50 transition-all duration-300 ${
          scrolled 
            ? 'bg-white/95 backdrop-blur-md shadow-lg' 
            : 'bg-cream'
        }`}>
          <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between py-4">
              <div className="flex items-center gap-3">
                <Logo />
                <div>
                  <h1 className="font-serif text-xl md:text-2xl font-semibold text-charcoal tracking-wide">
                    {config.restaurant_name}
                  </h1>
                  <p className="text-xs md:text-sm text-gold-600 font-medium tracking-widest uppercase">
                    {config.tagline}
                  </p>
                </div>
              </div>
              
              <nav className="hidden md:flex items-center gap-1">
                {categories.map((category) => (
                  <button
                    key={category}
                    onClick={() => onCategoryClick(category)}
                    className={`px-4 py-2 text-sm font-medium rounded-full transition-all duration-300 ${
                      activeCategory === category
                        ? 'bg-gold-600 text-white'
                        : 'text-charcoal hover:bg-gold-100 hover:text-gold-700'
                    }`}
                  >
                    {category}
                  </button>
                ))}
              </nav>

              <button className="md:hidden p-2 text-charcoal">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
            </div>

            {/* Mobile Navigation */}
            <nav className="md:hidden pb-4 overflow-x-auto scrollbar-hide">
              <div className="flex gap-2 min-w-max">
                {categories.map((category) => (
                  <button
                    key={category}
                    onClick={() => onCategoryClick(category)}
                    className={`px-4 py-2 text-sm font-medium rounded-full whitespace-nowrap transition-all duration-300 ${
                      activeCategory === category
                        ? 'bg-gold-600 text-white'
                        : 'bg-white text-charcoal border border-gold-200 hover:border-gold-400'
                    }`}
                  >
                    {category}
                  </button>
                ))}
              </div>
            </nav>
          </div>
        </header>
      );
    };

    // Food Card Component
    const FoodCard = ({ item, index }) => {
      const [isHovered, setIsHovered] = useState(false);

      return (
        <article
          className={`group bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-500 transform hover:-translate-y-1 fade-in-up stagger-${(index % 4) + 1}`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{ opacity: 0, animationFillMode: 'forwards' }}
        >
          <div className="relative overflow-hidden bg-gradient-to-br from-cream to-gold-50">
            <div className={`aspect-square p-6 transition-transform duration-500 ${isHovered ? 'scale-105' : 'scale-100'}`}>
              <FoodImage type={item.image} className="w-full h-full" />
            </div>
            <div className="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-md">
              <span className="font-serif text-lg font-semibold text-gold-700">${item.price}</span>
            </div>
          </div>
          
          <div className="p-5 md:p-6">
            <h3 className="font-serif text-xl md:text-2xl font-semibold text-charcoal mb-2 group-hover:text-gold-700 transition-colors duration-300">
              {item.name}
            </h3>
            
            <p className="text-gray-600 text-sm md:text-base leading-relaxed mb-4">
              {item.description}
            </p>
            
            <div className="pt-4 border-t border-gold-100">
              <p className="text-xs font-medium text-gold-600 uppercase tracking-wider mb-2">Ingredients</p>
              <div className="flex flex-wrap gap-1.5">
                {item.ingredients.map((ingredient, idx) => (
                  <span
