                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm5.657-9.193a1 1 0 00-1.414 0l-.707.707A1 1 0 005.05 6.464l.707-.707a1 1 0 011.414 0zM5 6a1 1 0 100-2H4a1 1 0 000 2h1z" clipRule="evenodd"/>

                <button className="md:hidden p-2 text-charcoal dark:text-gold-400">

                {categories.map((category) => (
                  <button
                    key={category}

                      activeCategory === category
                        ? 'bg-gold-600 text-white'
                        : isDark
                          ? 'bg-dark-card text-gold-300 border border-gold-700/30'
                          : 'bg-white text-charcoal border border-gold-200 hover:border-gold-400'
                    }`}
                  >
                    {category}
                  </button>
                ))}
              </div>
            </nav>
          </div>
        </header>

    };

    // Food Card Component
    const FoodCard = ({ item, index, isDark }) => {

      return (

          className={`group rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-500 transform hover:-translate-y-1 fade-in-up stagger-${(index % 4) + 1} ${
            isDark

              : 'bg-white'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{ opacity: 0, animationFillMode: 'forwards' }}
        >
          <div className={`relative overflow-hidden ${isDark ? 'bg-dark-surface' : 'bg-gradient-to-br from-cream to-gold-50'}`}>

            <p className={`text-sm md:text-base leading-relaxed mb-4 ${
              isDark ? 'text-gray-400' : 'text-gray-600'

            <div className={`pt-4 border-t ${isDark ? 'border-gold-700/30' : 'border-gold-100'}`}>
              <p className={`text-xs font-medium uppercase tracking-wider mb-2 ${
                isDark ? 'text-gold-400' : 'text-gold-600'
              }`}>

              </p>
              <div className="flex flex-wrap gap-1.5">
                {item.ingredients.map((ingredient, idx) => (
                  <span
                    key={idx}

      } text-white`}>
        <div className="absolute inset-0 opacity-10">
          <div className="absolute top-10 left-10 w-40 h-40 border border-gold-400 rounded-full"></div>
          <div className="absolute bottom-10 right-10 w-60 h-60 border border-gold-400 rounded-full"></div>
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 border border-gold-400 rounded-full"></div>
        </div>
        
        <div className="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
          <p className="text-gold-400 font-medium tracking-widest uppercase text-sm mb-4 fade-in" style={{ opacity: 0, animationFillMode: 'forwards' }}>

          <h1 className="font-serif text-4xl md:text-5xl lg:text-7xl font-bold mb-6 fade-in-up" style={{ opacity: 0, animationFillMode: 'forwards', animationDelay: '0.1s' }}>
            {config.restaurant_name}

          <div className="w-24 h-0.5 bg-gradient-to-r from-transparent via-gold-500 to-transparent mx-auto mb-6 fade-in" style={{ opacity: 0, animationFillMode: 'forwards', animationDelay: '0.2s' }}></div>
          <p className="text-lg md:text-xl text-gray-300 max-w-2xl mx-auto leading-relaxed fade-in-up" style={{ opacity: 0, animationFillMode: 'forwards', animationDelay: '0.3s' }}>

          </p>
          
          <div className="mt-10 flex flex-wrap justify-center gap-6 text-sm fade-in-up" style={{ opacity: 0, animationFillMode: 'forwards', animationDelay: '0.4s' }}>

            </div>
          </div>

                <p>الأحد: 4:00 مساءً - 9:00 مساءً</p>
                <p>الاثنين: مغلق</p>

            </div>
            
            <div>
              <h4 className={`font-serif text-lg font-semibold mb-4 ${isDark ? 'text-gold-400' : 'text-gold-400'}`}>

                <p>مسقط، عمان 123456</p>
                <p>reservations@lamaison.com</p>
                <p>+968 2222 3333</p>

          <div className={`mt-12 pt-8 border-t text-center ${isDark ? 'border-gold-700/30 text-gray-500' : 'border-gray-800 text-gray-500'}`}>

            </p>
          </div>
        </div>
      </footer>

    // Main App Component
    const App = () => {
      const [activeCategory, setActiveCategory] = useState("المقبلات");
      const [isDark, setIsDark] = useState(() => {
        if (typeof window !== 'undefined') {
          const saved = localStorage.getItem('theme-dark');
          return saved ? JSON.parse(saved) : false;
        }
        return false;
      });
      const [config, setConfig] = useState({
        restaurant_name: "لا ميزون",
        tagline: "تناول فاخر"
      });

      const defaultConfig = {
        restaurant_name: "لا ميزون",
        tagline: "تناول فاخر"
      };

      // Apply theme to document
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme-dark', JSON.stringify(isDark));
      }, [isDark]);

      useEffect(() => {
        if (window.elementSdk) {
          window.elementSdk.init({
            defaultConfig,
            onConfigChange: async (newConfig) => {
              setConfig(prev => ({
                ...prev,
                restaurant_name: newConfig.restaurant_name || defaultConfig.restaurant_name,
                tagline: newConfig.tagline || defaultConfig.tagline
              }));
            },
            mapToCapabilities: (cfg) => ({
              recolorables: [],
              borderables: [],
              fontEditable: undefined,
              fontSizeable: undefined
            }),
            mapToEditPanelValues: (cfg) => new Map([
              ["restaurant_name", cfg.restaurant_name || defaultConfig.restaurant_name],
              ["tagline", cfg.tagline || defaultConfig.tagline]
            ])
          });
        }
      }, []);

      const handleCategoryClick = (category) => {
        setActiveCategory(category);
        const element = document.getElementById(category.replace(' ', '-').toLowerCase());
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleThemeToggle = () => {
        setIsDark(prev => !prev);
      };

      const groupedMenu = categories.reduce((acc, category) => {
        acc[category] = menuData.filter(item => item.category === category);
        return acc;
      }, {});

      return (
        <div className={`min-h-full transition-colors duration-300 ${
          isDark
            ? 'bg-dark-bg text-white'
            : 'bg-cream text-charcoal'
        }`}>
          <Header 
            activeCategory={activeCategory} 
            onCategoryClick={handleCategoryClick}
            config={config}
            isDark={isDark}
            onThemeToggle={handleThemeToggle}
          />
          
          <HeroSection config={config} isDark={isDark} />
          
          <main className={`max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16 lg:py-20`}>
            <div className="text-center mb-12 md:mb-16">
              <p className={`font-medium tracking-widest uppercase text-sm mb-3 ${isDark ? 'text-gold-400' : 'text-gold-600'}`}>
                اكتشف
              </p>
              <h2 className={`font-serif text-3xl md:text-4xl lg:text-5xl font-semibold mb-4 ${
                isDark ? 'text-gold-300' : 'text-charcoal'
              }`}>
                قائمتنا
              </h2>
              <p className={`max-w-2xl mx-auto ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                كل طبق هو تحفة فنية، معدة بأفضل المكونات المحلية المصدر وتحضير يتسم بالاهتمام الشديد بالتفاصيل.
              </p>
            </div>

            {categories.map((category) => (
              <CategorySection
                key={category}
                category={category}
                items={groupedMenu[category]}
                isDark={isDark}
              />
            ))}
          </main>
          
          <Footer config={config} isDark={isDark} />
        </div>
      );
    };

    // Render
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
